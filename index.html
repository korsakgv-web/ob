<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>&#1055;&#1050;&#1060; &#1057;&#1090;&#1088;&#1086;&#1081;&#1088;&#1077;&#1082;&#1086;&#1085;&#1089;&#1090;&#1088;&#1091;&#1082;&#1094;&#1080;&#1103; &#8212; &#1054;&#1073;&#1089;&#1083;&#1077;&#1076;&#1086;&#1074;&#1072;&#1085;&#1080;&#1077;</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-dark: #18181b;
      --panel-bg: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --col-D: #ef4444;
      --col-VS: #f59e0b;
      --col-PR: #0ea5e9;
      --col-OB: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }

    .topbar-service {
      background: #141417; padding: 6px 8px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #27272a; gap: 4px; flex-wrap: wrap; z-index: 1001;
    }
    .service-group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .topbar-service button {
      background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
      padding: 5px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .topbar-service button:hover { border-color: var(--accent); }
    .topbar-service button.active-mode { background: #d97706; color: #fff; border-color: #f59e0b; }
    .topbar-service button.excel-btn { background: #15803d; color: #fff; border-color: #16a34a; }
    .topbar-service button.word-btn { background: #1d4ed8; color: #fff; border-color: #3b82f6; }
    .topbar-service button.cipher-btn { background: var(--accent); color: #fff; border-color: #60a5fa; font-weight: 800; }

    .workbar {
      background: var(--panel-bg); padding: 6px 8px;
      display: flex; gap: 6px; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #3f3f46; flex-wrap: wrap; z-index: 1000;
    }
    .tool-btn {
      background: #3f3f46; color: #fff; border: 1px solid #52525b;
      padding: 7px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; flex: 1; text-align: center; white-space: nowrap;
    }
    .tool-btn.active-view { background: var(--accent); border-color: #60a5fa; }
    .tool-btn.active-D { background: var(--col-D); border-color: #fca5a5; }
    .tool-btn.active-VS { background: var(--col-VS); color: #000; border-color: #fde047; }
    .tool-btn.active-PR { background: var(--col-PR); border-color: #7dd3fc; }
    .tool-btn.active-OB { background: var(--col-OB); color: #000; border-color: #86efac; }
    .tool-btn.active-axis { background: #9333ea; border-color: #d8b4fe; }

    .status-bar {
      background: #1f1f23; padding: 5px 10px; font-size: 11px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #3f3f46; color: var(--text-muted);
      z-index: 999; flex-wrap: wrap; gap: 6px;
    }
    .status-bar b { color: #fff; }

    #map { flex: 1; width: 100%; height: 100%; background: #cbd5e1; transition: background 0.2s; }
    body.dark-plan #map { background: #09090b; }
    body.dark-plan .leaflet-image-layer { filter: invert(1) hue-rotate(180deg) contrast(1.05); }

    .pt-marker {
      min-width: 28px; height: 26px; padding: 0 6px;
      border-radius: 13px; font-weight: 800; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.65);
      user-select: none; white-space: nowrap;
    }
    .pt-marker-D { background: var(--col-D); }
    .pt-marker-VS { background: var(--col-VS); color: #000; border-color: #18181b; }
    .pt-marker-PR { background: var(--col-PR); }
    .pt-marker-OB { background: var(--col-OB); color: #000; border-color: #18181b; }

    .axis-label-badge {
      background: #ffffff; color: #b91c1c; border: 2px solid #ef4444;
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: flex-start; justify-content: center;
      padding: 10px; z-index: 2000; overflow-y: auto;
    }
    .modal-backdrop.active { display: flex; }
    .modal-sheet {
      background: var(--panel-bg); width: 100%; max-width: 520px;
      border-radius: 14px; padding: 12px 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.8);
      border: 1px solid #3f3f46; margin: auto;
      display: flex; flex-direction: column; gap: 8px;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3f3f46; padding-bottom: 6px; }
    .modal-title { font-size: 15px; font-weight: 700; }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 11px; color: var(--text-muted); }

    input, select, textarea {
      background: #18181b; border: 1px solid #52525b; color: #fff;
      padding: 7px 9px; border-radius: 7px; font-size: 13px; width: 100%;
    }
    textarea { resize: vertical; min-height: 58px; }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .photo-card { background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; overflow: hidden; }
    .photo-card img { width: 100%; height: 95px; object-fit: cover; display: block; }
    .photo-meta { padding: 4px 6px; font-size: 10px; color: var(--text-muted); word-break: break-all; }

    .btn-primary { background: var(--accent); color: #fff; border: 1px solid #2563eb; border-radius: 8px; font-weight: 700; padding: 9px 12px; cursor: pointer; }
    .btn-del { background: #991b1b; color: #fff; border: 1px solid #ef4444; border-radius: 8px; font-weight: 600; padding: 9px 12px; cursor: pointer; }

    .table-modal {
      position: fixed; inset: 0; background: var(--bg-dark);
      z-index: 2500; display: none; flex-direction: column;
    }
    .table-modal.active { display: flex; }
    .table-container { flex: 1; overflow: auto; padding: 10px; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data-table th, table.data-table td { border: 1px solid #3f3f46; padding: 6px; text-align: left; vertical-align: top; }
    table.data-table th { background: #27272a; position: sticky; top: 0; z-index: 10; }
  </style>
</head>
<body>

  <input type="file" id="planInput" accept="application/pdf,image/*,.pdf" style="display:none" onchange="handlePlanUpload(event)">
  <input type="file" id="projectInput" accept=".json" style="display:none" onchange="importProjectBackup(event)">
  <input type="file" id="settingsInput" accept=".json" style="display:none" onchange="uploadSettingsTemplate(event)">
  <input type="file" id="photoInput" accept="image/*" multiple capture="environment" style="display:none" onchange="handlePointPhotos(event)">

  <div class="topbar-service">
    <div class="service-group">
      <button type="button" class="cipher-btn" id="hdrCipherBtn" onclick="openProjectModal()">260702-OB</button>
      <button type="button" id="btnPlan" onclick="document.getElementById('planInput').click()"></button>
      <button type="button" id="btnPrevPage" onclick="changePdfPage(-1)" style="display:none;">&#9664;</button>
      <span id="pageIndicator" style="font-size:11px; color:#a1a1aa; display:none;">1/1</span>
      <button type="button" id="btnNextPage" onclick="changePdfPage(1)" style="display:none;">&#9654;</button>
      <button type="button" id="modeBtn" onclick="toggleEditMode()"></button>
      <button type="button" id="themeBtn" onclick="toggleDarkPlan()"></button>
    </div>

    <div class="service-group">
      <button type="button" id="btnSettings" onclick="openSettingsModal()"></button>
      <button type="button" id="btnTable" onclick="openTableModal()"></button>
      <button type="button" class="word-btn" id="btnReports" onclick="openReportsModal()"></button>
      <button type="button" class="excel-btn" id="btnZip" onclick="exportFullZip()"></button>
      <button type="button" id="btnSaveDb" onclick="exportProjectBackup()"></button>
      <button type="button" id="btnLoadDb" onclick="document.getElementById('projectInput').click()"></button>
    </div>
  </div>

  <div class="workbar">
    <button type="button" class="tool-btn active-view" id="tool-view" onclick="setMode('view')"></button>
    <button type="button" class="tool-btn" id="tool-D" onclick="setMode('D')"></button>
    <button type="button" class="tool-btn" id="tool-VS" onclick="setMode('VS')"></button>
    <button type="button" class="tool-btn" id="tool-PR" onclick="setMode('PR')"></button>
    <button type="button" class="tool-btn" id="tool-OB" onclick="setMode('OB')"></button>
    <button type="button" class="tool-btn" id="tool-axis-v" onclick="setMode('axis-v')"></button>
    <button type="button" class="tool-btn" id="tool-axis-h" onclick="setMode('axis-h')"></button>
  </div>

  <div class="status-bar">
    <div id="statusText"></div>
    <div>
      <button type="button" id="btnRecalcAxes" onclick="recalculateAllPointAxes()" style="background:#27272a; color:#4ade80; border:1px solid #3f3f46; border-radius:4px; padding:2px 6px; font-size:11px; cursor:pointer;"></button>
      <button type="button" id="btnClearAxes" onclick="clearAllAxes()" style="background:#27272a; color:#f87171; border:1px solid #3f3f46; border-radius:4px; padding:2px 6px; font-size:11px; cursor:pointer;"></button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Point Modal -->
  <div class="modal-backdrop" id="pointModal" onclick="if(event.target===this) closePointModal()">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="ptModalTitle"></span>
        <button type="button" class="close-btn" onclick="closePointModal()">&#10005;</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label id="lblPtType"></label>
          <select id="ptType" onchange="onPointTypeChange()">
            <option value="D" id="optTypeD"></option>
            <option value="VS" id="optTypeVS"></option>
            <option value="PR" id="optTypePR"></option>
            <option value="OB" id="optTypeOB"></option>
          </select>
        </div>
        <div class="form-group">
          <label id="lblPtCode"></label>
          <input type="text" id="ptCode" oninput="saveActivePoint(true)">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label id="lblPtAxes"></label>
          <input type="text" id="ptAxes" oninput="saveActivePoint(true)">
        </div>
        <div class="form-group">
          <label id="lblPtZone"></label>
          <input type="text" id="ptZone" oninput="saveActivePoint(true)">
        </div>
      </div>

      <div class="form-group full">
        <label id="lblPtStruct"></label>
        <select id="ptStructure" onchange="saveActivePoint()"></select>
      </div>

      <div class="form-group full">
        <label id="lblPtDesc"></label>
        <textarea id="ptDesc" oninput="saveActivePoint()"></textarea>
      </div>

      <div id="blockDefect" class="form-group full">
        <label id="lblPtCat"></label>
        <select id="ptCategory" onchange="saveActivePoint()"></select>
      </div>

      <div id="blockOpening" class="form-group full" style="display:none;">
        <label id="lblPtOpenRes"></label>
        <textarea id="ptOpeningRes" oninput="saveActivePoint()"></textarea>
      </div>

      <div id="blockStrength" style="display:none; flex-direction:column; gap:6px;">
        <div class="form-group full">
          <label id="lblPtInst"></label>
          <select id="ptInstrument" onchange="saveActivePoint()"></select>
        </div>
        <div class="form-group full">
          <label id="lblPtRead"></label>
          <input type="text" id="ptReadings" placeholder="58.2, 61.4, 59.5..." oninput="onStrengthReadingsInput()">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label id="lblPtMpa"></label>
            <input type="number" step="0.1" id="ptMpa" placeholder="59.6" oninput="onMpaInput()">
          </div>
          <div class="form-group">
            <label id="lblPtClass"></label>
            <input type="text" id="ptConcreteClass" placeholder="B50" oninput="saveActivePoint()">
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #3f3f46; padding-top:6px;">
        <span id="lblCustomAttrs" style="font-size:11px; color:var(--text-muted); font-weight:700;"></span>
        <button type="button" id="btnAddAttrInline" onclick="openSettingsModal()" style="background:#3f3f46; color:#fff; border:none; border-radius:4px; padding:2px 8px; font-size:11px; cursor:pointer;"></button>
      </div>
      <div id="customAttrsBox" class="form-grid"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #3f3f46; padding-top:6px;">
        <span id="lblPhotosHdr" style="font-size:11px; color:var(--text-muted); font-weight:700;"></span>
        <button type="button" class="btn-primary" id="btnAddPhoto" style="padding:4px 10px; font-size:12px;" onclick="document.getElementById('photoInput').click()"></button>
      </div>
      <div id="ptPhotosBox" class="photo-grid"></div>

      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" class="btn-primary" id="btnPtDone" style="flex:2;" onclick="closePointModal()"></button>
        <button type="button" class="btn-del" id="btnPtDelete" style="flex:1;" onclick="deleteActivePoint()"></button>
      </div>
    </div>
  </div>

  <!-- Table Modal -->
  <div class="table-modal" id="tableModal">
    <div class="topbar-service" style="padding:10px;">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span id="lblTblTitle" style="font-weight:700; font-size:14px; color:#fff;"></span>
        <select id="tblFilterType" onchange="renderTableModal()" style="width:170px; padding:4px;">
          <option value="ALL" id="optFilterAll"></option>
          <option value="D" id="optFilterD"></option>
          <option value="VS" id="optFilterVS"></option>
          <option value="PR" id="optFilterPR"></option>
          <option value="OB" id="optFilterOB"></option>
        </select>
        <button type="button" id="btnBatchAxes" onclick="batchAssignAxesPrompt()"></button>
        <button type="button" id="btnRenumber" onclick="renumberAllPoints()"></button>
      </div>
      <div class="service-group">
        <button type="button" class="excel-btn" id="btnTblExcel" onclick="exportExcel()">.XLSX</button>
        <button type="button" id="btnTblClose" onclick="closeTableModal()">&#10005;</button>
      </div>
    </div>
    <div class="table-container">
      <table class="data-table">
        <thead><tr id="tblHead"></tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Reports Modal -->
  <div class="modal-backdrop" id="reportsModal" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="lblRepTitle"></span>
        <button type="button" class="close-btn" onclick="document.getElementById('reportsModal').classList.remove('active')">&#10005;</button>
      </div>
      <button type="button" class="btn-primary" style="background:#15803d;" id="btnRep1" onclick="exportExcel()"></button>
      <button type="button" class="btn-primary" id="btnRep2" onclick="exportWordDefectList(true)"></button>
      <button type="button" class="btn-primary" id="btnRep3" onclick="exportWordDefectList(false)"></button>
      <button type="button" class="btn-primary" id="btnRep4" onclick="exportWordPhotoAlbum()"></button>
      <button type="button" class="btn-primary" id="btnRep5" onclick="exportWordStrengthProtocol()"></button>
      <button type="button" class="btn-primary" style="background:#0f766e;" id="btnRep6" onclick="exportFullZip()"></button>
    </div>
  </div>

  <!-- Project Passport Modal -->
  <div class="modal-backdrop" id="projectModal" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="lblPrjModalTitle"></span>
        <button type="button" class="close-btn" onclick="document.getElementById('projectModal').classList.remove('active')">&#10005;</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label id="lblPrjCipher"></label>
          <input type="text" id="prjCipher">
        </div>
        <div class="form-group">
          <label id="lblPrjShort"></label>
          <input type="text" id="prjShort">
        </div>
        <div class="form-group full">
          <label id="lblPrjFull"></label>
          <input type="text" id="prjFull">
        </div>
        <div class="form-group">
          <label id="lblPrjDate"></label>
          <input type="date" id="prjDate">
        </div>
        <div class="form-group">
          <label id="lblPrjProt"></label>
          <input type="text" id="prjProtNum">
        </div>
        <div class="form-group">
          <label id="lblPrjDir"></label>
          <input type="text" id="prjDirector">
        </div>
        <div class="form-group">
          <label id="lblPrjGip"></label>
          <input type="text" id="prjGip">
        </div>
      </div>
      <button type="button" class="btn-primary" id="btnSavePrj" onclick="saveProjectMeta()"></button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="lblSetTitle"></span>
        <button type="button" class="close-btn" onclick="document.getElementById('settingsModal').classList.remove('active')">&#10005;</button>
      </div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn-primary" style="flex:1; font-size:12px;" id="btnDlSet" onclick="downloadSettingsTemplate()"></button>
        <button type="button" class="btn-primary" style="flex:1; font-size:12px; background:#3f3f46;" id="btnUlSet" onclick="document.getElementById('settingsInput').click()"></button>
      </div>

      <div id="lblInstHdr" style="font-size:11px; color:var(--text-muted); font-weight:700; margin-top:4px;"></div>
      <div id="instListBox" style="display:flex; flex-direction:column; gap:4px; max-height:130px; overflow-y:auto;"></div>
      <div class="form-grid">
        <input type="text" id="newInstName">
        <input type="text" id="newInstSerial">
        <input type="text" id="newInstGost">
        <button type="button" class="btn-primary" id="btnAddInst" onclick="addInstrument()"></button>
      </div>

      <div id="lblAttrHdr" style="font-size:11px; color:var(--text-muted); font-weight:700; margin-top:4px;"></div>
      <div id="attrListBox" style="display:flex; flex-direction:column; gap:4px; max-height:130px; overflow-y:auto;"></div>
      <div class="form-grid">
        <input type="text" id="newAttrName">
        <select id="newAttrType">
          <option value="text" id="optAttrText"></option>
          <option value="number" id="optAttrNum"></option>
          <option value="link" id="optAttrLink"></option>
        </select>
        <button type="button" class="btn-primary" style="grid-column:1/-1;" id="btnAddAttr" onclick="addCustomAttribute()"></button>
      </div>
    </div>
  </div>

<script>
// 100% ASCII-SAFE UNICODE DICTIONARY
const U = {
  prefixD: "\u0414",
  prefixVS: "\u0412\u0441",
  prefixPR: "\u041F\u0440",
  prefixOB: "\u041E\u0431\u0449",
  btnPlan: "\uD83D\uDDFA \u041F\u043B\u0430\u043D (PDF/\u0424\u043E\u0442\u043E)",
  btnMoveOff: "\u270F\uFE0F \u041A\u043E\u0440\u0440\u0435\u043A\u0446\u0438\u044F",
  btnMoveOn: "\uD83D\uDD13 \u0414\u0432\u0438\u0433\u0430\u0435\u043C",
  btnDark: "\uD83C\uDF19 \u0422\u0435\u043C\u043D.",
  btnLight: "\u2600\uFE0F \u0421\u0432\u0435\u0442.",
  btnSettings: "\u2699\uFE0F \u041F\u0440\u0438\u0431\u043E\u0440\u044B/\u041F\u043E\u043B\u044F",
  btnTable: "\uD83D\uDCCB \u0422\u0430\u0431\u043B\u0438\u0446\u0430",
  btnReports: "\uD83D\uDCDD \u041E\u0442\u0447\u0435\u0442\u044B Word/Excel",
  btnZip: "\uD83D\uDCE6 ZIP",
  btnSaveDb: "\uD83D\uDCBE \u0411\u0430\u0437\u0430",
  btnLoadDb: "\uD83D\uDCC2 \u0417\u0430\u0433\u0440.",
  toolView: "\u270B \u0412\u044B\u0431\u043E\u0440",

function initMap() {
  map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 4,
    zoomSnap: 0.25,
    attributionControl: false
  });
  const bounds = [[0, 0], [PLAN_H, PLAN_W]];
  map.fitBounds(bounds);

  axesLayerGroup = L.layerGroup().addTo(map);
  markersLayerGroup = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    const x = Math.round(e.latlng.lng * 10) / 10;
    const y = Math.round(e.latlng.lat * 10) / 10;

    if (['D', 'VS', 'PR', 'OB'].includes(state.mode)) {
      createPointOnMap(state.mode, x, y);
    } else if (state.mode === 'axis-v') {
      const def = String(state.axes.vertical.filter(a => a.page === state.currentPage).length + 1);
      const lbl = prompt('Vertical axis label (1, 2, 3...):', def);
      if (lbl) {
        state.axes.vertical.push({ id: Date.now(), label: lbl.trim(), x, page: state.currentPage });
        state.axes.vertical.sort((a, b) => a.x - b.x);
        saveState();
        renderAxesAndMarkers();
      }
    } else if (state.mode === 'axis-h') {
      const rus = ['\u0410', '\u0411', '\u0412', '\u0413', '\u0414', '\u0415', '\u0416', '\u0418', '\u041A'];
      const idx = state.axes.horizontal.filter(a => a.page === state.currentPage).length;
      const lbl = prompt('Horizontal axis label (A, B, V...):', rus[idx] || '\u0410');
      if (lbl) {
        state.axes.horizontal.push({ id: Date.now(), label: lbl.trim(), y, page: state.currentPage });
        state.axes.horizontal.sort((a, b) => a.y - b.y);
        saveState();
        renderAxesAndMarkers();
      }
    }
  });
}

function setMapBackground(dataUrl) {
  const bounds = [[0, 0], [PLAN_H, PLAN_W]];
  if (imageOverlay) map.removeLayer(imageOverlay);
  imageOverlay = L.imageOverlay(dataUrl, bounds).addTo(map);
}

// ==================== PDF & IMAGE LOADING ====================
async function handlePlanUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('statusText').textContent = 'Loading: ' + file.name + '...';

  try {
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    if (isPdf) {
      const arrayBuffer = await file.arrayBuffer();
      try {
        const blobWorker = new Blob([
          'importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");'
        ], { type: 'application/javascript' });
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blobWorker);
      } catch (we) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      pdfDocInstance = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      state.pageCount = pdfDocInstance.numPages;
      state.currentPage = 1;
      updatePageControls();
      await renderPdfPage(1);
    } else {
      pdfDocInstance = null;
      state.pageCount = 1;
      state.currentPage = 1;
      updatePageControls();
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.bgDataUrl = ev.target.result;
        saveState();
        setMapBackground(ev.target.result);
        document.getElementById('statusText').textContent = 'OK: ' + file.name;
      };
      reader.readAsDataURL(file);
    }
  } catch (err) {
    alert('PDF/Image Error: ' + err.message);
    document.getElementById('statusText').textContent = 'Error: ' + err.message;
  }
  e.target.value = '';
}

async function renderPdfPage(pageNum) {
  if (!pdfDocInstance) return;
  const page = await pdfDocInstance.getPage(pageNum);
  const viewport = page.getViewport({ scale: 2.0 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  state.bgDataUrl = dataUrl;
  saveState();
  setMapBackground(dataUrl);
  renderAxesAndMarkers();
  document.getElementById('statusText').textContent = U.sheetWord + ' ' + pageNum + ' / ' + state.pageCount;
}

async function changePdfPage(delta) {
  if (!pdfDocInstance) return;
  const next = state.currentPage + delta;
  if (next < 1 || next > state.pageCount) return;
  state.currentPage = next;
  updatePageControls();
  await renderPdfPage(next);
}

function updatePageControls() {
  const show = state.pageCount > 1;
  document.getElementById('btnPrevPage').style.display = show ? 'inline-block' : 'none';
  document.getElementById('btnNextPage').style.display = show ? 'inline-block' : 'none';
  const ind = document.getElementById('pageIndicator');
  ind.style.display = show ? 'inline-block' : 'none';
  ind.textContent = state.currentPage + '/' + state.pageCount;
}

// ==================== RENDER AXES & MARKERS ====================
function renderAxesAndMarkers() {
  if (!axesLayerGroup || !markersLayerGroup) return;
  axesLayerGroup.clearLayers();
  markersLayerGroup.clearLayers();

  const curPage = state.currentPage || 1;

  state.axes.vertical.filter(a => a.page === curPage).forEach(ax => {
    L.polyline([[0, ax.x], [PLAN_H, ax.x]], { color: '#ef4444', weight: 1.5, dashArray: '6, 6' }).addTo(axesLayerGroup);
    const icon = L.divIcon({ className: '', html: `<div class="axis-label-badge">${ax.label}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
    L.marker([20, ax.x], { icon, interactive: false }).addTo(axesLayerGroup);
  });

  state.axes.horizontal.filter(a => a.page === curPage).forEach(ax => {
    L.polyline([[ax.y, 0], [ax.y, PLAN_W]], { color: '#ef4444', weight: 1.5, dashArray: '6, 6' }).addTo(axesLayerGroup);
    const icon = L.divIcon({ className: '', html: `<div class="axis-label-badge">${ax.label}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
    L.marker([ax.y, 20], { icon, interactive: false }).addTo(axesLayerGroup);
  });

  state.points.filter(p => (p.page || 1) === curPage).forEach(pt => {
    const extraLabel = (pt.type === 'PR' && pt.mpa) ? ` (${pt.mpa})` : '';
    const icon = L.divIcon({
      className: '',
      html: `<div class="pt-marker pt-marker-${pt.type}">${pt.code}${extraLabel}</div>`,
      iconSize: [34, 26],
      iconAnchor: [17, 13]
    });

    const marker = L.marker([pt.y, pt.x], {
      icon,
      draggable: state.editMode
    }).addTo(markersLayerGroup);

    marker.on('click', (ev) => {
      L.DomEvent.stopPropagation(ev);
      if (!state.editMode) openPointModal(pt.id);
    });

    marker.on('dragend', (ev) => {
      const pos = ev.target.getLatLng();
      pt.x = Math.round(pos.lng * 10) / 10;
      pt.y = Math.round(pos.lat * 10) / 10;
      const autoAx = computeAxesForCoords(pt.x, pt.y, pt.page || 1);
      if (autoAx) { pt.axes = autoAx; refreshPointPhotoNames(pt); }
      saveState();
    });
  });
}

function createPointOnMap(type, x, y) {
  const num = state.points.filter(p => p.type === type).length + 1;
  const page = state.currentPage || 1;
  const prefix = TYPE_PREFIX[type] || type;
  const newPt = {
    id: 'pt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    type,
    code: prefix + num,
    page,
    x,
    y,
    axes: computeAxesForCoords(x, y, page) || '',
    zone: U.sheetWord + ' ' + page,
    structure: state.settings.structures[0] || '',
    description: '',
    category: state.settings.defectCategories[3] || '',
    openingResult: '',
    instrumentId: state.settings.instruments[0] ? state.settings.instruments[0].id : 'ips_mg403',
    readings: '',
    mpa: '',
    concreteClass: '',
    customValues: {},
    photos: []
  };
  state.points.push(newPt);
  setMode('view');
  saveState();
  renderAxesAndMarkers();
  openPointModal(newPt.id);
}

function onStrengthReadingsInput() {
  const nums = document.getElementById('ptReadings').value
    .split(/[,\s;]+/).map(s => parseFloat(s.replace(',', '.'))).filter(n => !isNaN(n) && n > 0);
  if (nums.length > 0) {
    const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
    const valid = nums.filter(v => Math.abs(v - avg) / avg <= 0.10);
    const mean = Math.round(((valid.length ? valid : nums).reduce((a, b) => a + b, 0) / (valid.length || nums.length)) * 10) / 10;
    document.getElementById('ptMpa').value = mean;
    document.getElementById('ptConcreteClass').value = estimateConcreteClass(mean);
  }
  saveActivePoint();
}

function onMpaInput() {
  const val = parseFloat(document.getElementById('ptMpa').value);
  if (!isNaN(val) && val > 0) document.getElementById('ptConcreteClass').value = estimateConcreteClass(val);
  saveActivePoint();
}

function estimateConcreteClass(mpa) {
  const t = [
    { min: 64, cls: 'B55' }, { min: 55, cls: 'B50' }, { min: 51, cls: 'B45' },
    { min: 45, cls: 'B40' }, { min: 38.5, cls: 'B35' }, { min: 32, cls: 'B30' },
    { min: 28, cls: 'B27.5' }, { min: 25, cls: 'B25' }, { min: 21.5, cls: 'B22.5' },
    { min: 19, cls: 'B20' }, { min: 14, cls: 'B15' }, { min: 0, cls: 'B10' }
  ];
  const found = t.find(r => mpa >= r.min);
  return found ? found.cls : 'B15';
}

function buildPhotoFileName(pt, index, isoTs) {
  const clean = (s) => (s || '').replace(/[^a-zA-Z\u0400-\u04FF0-9_-]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  const obj = clean(state.project.shortName || state.project.cipher);
  const zone = clean(pt.zone || ('L' + (pt.page || 1)));
  const ax = pt.axes ? clean(pt.axes) : U.noAxes;
  const dt = (isoTs || new Date().toISOString()).replace(/[-:]/g, '').replace('T', '_').slice(0, 15);
  return `${obj}_${zone}_${ax}_${clean(pt.code)}_${dt}_${index + 1}.jpg`;
}

function refreshPointPhotoNames(pt) {
  pt.photos.forEach((ph, i) => { ph.fileName = buildPhotoFileName(pt, i, ph.timestamp); });
}

function handlePointPhotos(e) {
  const pt = state.points.find(p => p.id === state.selectedPtId);
  if (!pt) return;
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const ts = file.lastModified ? new Date(file.lastModified).toISOString() : new Date().toISOString();
      pt.photos.push({
        id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        fileName: buildPhotoFileName(pt, pt.photos.length, ts),
        timestamp: ts,
        dataUrl: ev.target.result
      });
      renderPointPhotos(pt);
      saveState();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderPointPhotos(pt) {
  const box = document.getElementById('ptPhotosBox');
  if (!pt.photos.length) {
    box.innerHTML = `<div style="grid-column:1/-1; font-size:11px; color:var(--text-muted);">${U.noPhotos}</div>`;
    return;
  }
  box.innerHTML = pt.photos.map((ph, i) => `
    <div class="photo-card">
      <img src="${ph.dataUrl}">
      <div class="photo-meta">
        <div><b>#${i + 1}</b> ${ph.fileName}</div>
        <button type="button" class="btn-del" style="padding:2px 6px; font-size:10px; margin-top:3px;" onclick="removePhoto('${ph.id}')">X</button>
      </div>
    </div>
  `).join('');
}

function removePhoto(phId) {
  const pt = state.points.find(p => p.id === state.selectedPtId);
  if (!pt) return;
  pt.photos = pt.photos.filter(p => p.id !== phId);
  refreshPointPhotoNames(pt);
  renderPointPhotos(pt);
  saveState();
}

function computeAxesForCoords(x, y, page) {
  const v = state.axes.vertical.filter(a => a.page === page).sort((a, b) => a.x - b.x);
  const h = state.axes.horizontal.filter(a => a.page === page).sort((a, b) => a.y - b.y);
  if (!v.length && !h.length) return '';

  let vp = v.length === 1 ? v[0].label : '';
  if (v.length >= 2) {
    let l = v[0].label, r = v[v.length - 1].label;
    for (let i = 0; i < v.length - 1; i++) {
      if (x >= v[i].x && x <= v[i + 1].x) { l = v[i].label; r = v[i + 1].label; break; }
    }
    vp = l + '-' + r;
  }

  let hp = h.length === 1 ? h[0].label : '';
  if (h.length >= 2) {
    let b = h[0].label, t = h[h.length - 1].label;
    for (let i = 0; i < h.length - 1; i++) {
      if (y >= h[i].y && y <= h[i + 1].y) { b = h[i].label; t = h[i + 1].label; break; }
    }
    hp = b + '-' + t;
  }
  return [hp, vp].filter(Boolean).join(' / ');
}

function recalculateAllPointAxes() {
  let cnt = 0;
  state.points.forEach(pt => {
    const ax = computeAxesForCoords(pt.x, pt.y, pt.page || 1);
    if (ax) { pt.axes = ax; refreshPointPhotoNames(pt); cnt++; }
  });
  saveState();
  renderAxesAndMarkers();

function buildExcelWorkbook() {
  const wb = XLSX.utils.book_new();
  const customCols = state.settings.customAttributes;

  const allRows = state.points.map((pt, i) => {
    const r = {
      'N': i + 1, 'Type': TYPE_PREFIX[pt.type] || pt.type, 'ID': pt.code, 'Page': pt.page || 1,
      'Axes': pt.axes || U.noAxes, 'Zone': pt.zone || '', 'Structure': pt.structure || '',
      'Description': pt.description || '', 'Category': pt.type === 'D' ? pt.category : '',
      'Opening': pt.type === 'VS' ? pt.openingResult : '',
      'MPa': pt.type === 'PR' ? pt.mpa : '', 'Class': pt.type === 'PR' ? pt.concreteClass : '',
      'Photos': pt.photos.map(p => 'photos/' + p.fileName).join('; ')
    };
    customCols.forEach(c => { r[c.name] = (pt.customValues && pt.customValues[c.id]) || ''; });
    return r;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allRows.length ? allRows : [{}]), 'All_Points');

  const defRows = state.points.filter(p => p.type === 'D').map((p, i) => ({
    'N': i + 1, 'ID': p.code, 'Axes': p.axes || '', 'Description': p.code + '. ' + (p.description || ''),
    'Category': p.category, 'Photos': p.photos.map(ph => ph.fileName).join('; ')
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(defRows.length ? defRows : [{}]), 'Defects');

  const prRows = state.points.filter(p => p.type === 'PR').map(p => ({
    'ID': p.code, 'Axes': p.axes || '', 'Readings': p.readings || '',
    'MPa': p.mpa, 'Class': p.concreteClass
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prRows.length ? prRows : [{}]), 'Strength');

  return wb;
}

function exportExcel() {
  XLSX.writeFile(buildExcelWorkbook(), `${state.project.cipher}_Survey_DB.xlsx`);
}

async function exportFullZip() {
  const zip = new JSZip();
  zip.file('project_db.json', JSON.stringify(state, null, 2));
  zip.file('settings_template.json', JSON.stringify(state.settings, null, 2));

  const wb = buildExcelWorkbook();
  zip.file(`reports/${state.project.cipher}_Survey_DB.xlsx`, XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));

  const photosFolder = zip.folder('photos');
  state.points.forEach(pt => {
    pt.photos.forEach(ph => {
      const b64 = ph.dataUrl.split(',')[1];
      if (b64) photosFolder.file(ph.fileName, b64, { base64: true });
    });
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${state.project.cipher}_Project.zip`; a.click();
}
