  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      var ctx = c.getContext('2d');
      var bgGrad = ctx.createLinearGradient(0, 0, 0, 180);
      bgGrad.addColorStop(0, '#18181b');
      bgGrad.addColorStop(1, '#27272a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 180, 180);

      var goldGrad = ctx.createLinearGradient(40, 35, 140, 145);
      goldGrad.addColorStop(0, '#fef08a');
      goldGrad.addColorStop(0.5, '#eab308');
      goldGrad.addColorStop(1, '#a16207');

      ctx.fillStyle = goldGrad;
      ctx.fillRect(88, 16, 4, 18);
      ctx.beginPath(); ctx.arc(90, 38, 7, Math.PI, 0); ctx.fill();
      ctx.fillRect(81, 38, 18, 12);

      ctx.beginPath(); ctx.arc(90, 108, 56, Math.PI, 0, false); ctx.closePath();
      ctx.fillStyle = goldGrad; ctx.fill();

      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(30, 110, 120, 18);
      ctx.fillStyle = '#18181b';
      for (var x = 38; x <= 138; x += 12) { ctx.fillRect(x, 113, 5, 12); }
      ctx.fillStyle = goldGrad;
      ctx.fillRect(22, 130, 136, 8);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(90, 88, 32, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(42, 88); ctx.lineTo(138, 88); ctx.moveTo(90, 40); ctx.lineTo(90, 136); ctx.stroke();

      ctx.beginPath(); ctx.arc(90, 88, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444'; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = '#f4f4f5';
      ctx.font = 'bold 15px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u0421\u0422\u0420\u041E\u0419\u0420\u0415\u041A', 90, 162);

      var iconEl = document.getElementById('appIcon');
      if (iconEl) iconEl.href = c.toDataURL('image/png');
    });
  </script>

  <style>
    :root {
      --bg-dark: #18181b;
      --panel-bg: #27272a;
      --text-main: #f4f4f5;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }

    .topbar-service {
      background: #141417; padding: 5px 8px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #27272a; gap: 4px; flex-wrap: wrap; z-index: 1001;
    }
    .service-group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .topbar-service button {
      background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
      padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .topbar-service button.active-mode { background: #d97706; color: #fff; border-color: #f59e0b; }
    .topbar-service button.excel-btn { background: #15803d; color: #fff; border-color: #16a34a; }
    .topbar-service button.word-btn { background: #1d4ed8; color: #fff; border-color: #3b82f6; }
    .topbar-service button.cipher-btn { background: var(--accent); color: #fff; border-color: #60a5fa; font-weight: 800; }

    .workbar {
      background: var(--panel-bg); padding: 6px 8px;
      display: flex; gap: 5px; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #3f3f46; flex-wrap: wrap; z-index: 1000;
    }
    .tool-btn {
      background: #3f3f46; color: #fff; border: 1px solid #52525b;
      padding: 7px 8px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; flex: 1; text-align: center; white-space: nowrap;
    }
    .tool-btn.active-view { background: var(--accent); border-color: #60a5fa; }
    .tool-btn.active-D { background: var(--col-D); border-color: #fca5a5; }
    .tool-btn.active-VS { background: var(--col-VS); color: #000; border-color: #fde047; }
    .tool-btn.active-PR { background: var(--col-PR); border-color: #7dd3fc; }
    .tool-btn.active-OB { background: var(--col-OB); color: #000; border-color: #86efac; }
    .tool-btn.active-axis { background: #9333ea; border-color: #d8b4fe; }

    .status-bar {
      background: #1f1f23; padding: 5px 10px; font-size: 11px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #3f3f46; color: var(--text-muted);
      z-index: 999; flex-wrap: wrap; gap: 6px;
    }
    .status-bar b { color: #fff; }

    #map { flex: 1; width: 100%; background: #e5e5e5; }
    body.dark-plan #map { background: #09090b; }
    body.dark-plan .leaflet-image-layer { filter: invert(1) hue-rotate(180deg) contrast(1.05); }

    .pt-marker {
      min-width: 28px; height: 24px; padding: 0 5px;
      border-radius: 12px; font-weight: 800; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.65);
      user-select: none; white-space: nowrap;
    }
    .pt-marker-D { background: var(--col-D); }
    .pt-marker-VS { background: var(--col-VS); color: #000; border-color: #18181b; }
    .pt-marker-PR { background: var(--col-PR); }
    .pt-marker-OB { background: var(--col-OB); color: #000; border-color: #18181b; }

    .axis-badge {
      background: #ffffff; color: #b91c1c; border: 2px solid #ef4444;
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      cursor: grab; user-select: none;
    }
    .axis-badge:active { cursor: grabbing; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: flex-start; justify-content: center;
      padding: 8px; z-index: 2000; overflow-y: auto;
    }
    .modal-backdrop.active { display: flex; }
    .modal-sheet {
      background: var(--panel-bg); width: 100%; max-width: 520px;
      border-radius: 14px; padding: 12px 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.8);
      border: 1px solid #3f3f46; margin: auto;

    .modal-title { font-size: 15px; font-weight: 700; }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 11px; color: var(--text-muted); }

    input, select, textarea {
      background: #18181b; border: 1px solid #52525b; color: #fff;
      padding: 7px 9px; border-radius: 7px; font-size: 13px; width: 100%;
    }
    textarea { resize: vertical; min-height: 54px; }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .photo-card { background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; overflow: hidden; }
    .photo-card img { width: 100%; height: 95px; object-fit: cover; display: block; }
    .photo-meta { padding: 4px 6px; font-size: 10px; color: var(--text-muted); word-break: break-all; }

    .btn-del { background: #991b1b; color: #fff; border: 1px solid #ef4444; border-radius: 8px; font-weight: 600; padding: 9px 12px; cursor: pointer; }

    .table-modal {
      position: fixed; inset: 0; background: var(--bg-dark);
      z-index: 2500; display: none; flex-direction: column;
    }
    .table-modal.active { display: flex; }
    .table-container { flex: 1; overflow: auto; padding: 10px; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data-table th, table.data-table td { border: 1px solid #3f3f46; padding: 6px; text-align: left; vertical-align: top; }
    table.data-table th { background: #27272a; position: sticky; top: 0; z-index: 10; }
  </style>
</head>

    fullName: "\u043F\u043B\u0438\u0442\u044B \u043F\u043E\u043A\u0440\u044B\u0442\u0438\u044F \u0437\u0434\u0430\u043D\u0438\u044F \u043F\u043E \u0430\u0434\u0440\u0435\u0441\u0443: \u0433. \u0421\u0430\u043D\u043A\u0442-\u041F\u0435\u0442\u0435\u0440\u0431\u0443\u0440\u0433, \u0443\u043B. \u041F\u0443\u043B\u043A\u043E\u0432\u0441\u043A\u0430\u044F, \u0434. 9, \u043A\u043E\u0440\u043F. 2",
    date: new Date().toISOString().slice(0, 10),
    protocolNum: "01/260702",
    director: "\u0413.\u0412. \u041A\u043E\u0440\u0441\u0430\u043A",
    gip: "\u0412.\u0412. \u0423\u0441\u043E\u0432"
  },
  settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
  axes: { vertical: [], horizontal: [] },
  points: [],
  bgDataUrl: null
};

let map, imageOverlay, markersLayerGroup, axesLayerGroup;
let pdfDocInstance = null;
const PLAN_W = 1000, PLAN_H = 700;

function saveState() {
  try {
    var copy = Object.assign({}, state, { bgDataUrl: null });
    localStorage.setItem('stroyrek_isaak_state_v2', JSON.stringify(copy));
    if (state.bgDataUrl) {
      localStorage.setItem('stroyrek_isaak_bg_v2', state.bgDataUrl);
    }
  } catch (e) {}
}

function loadStateSync() {
  try {
    var raw = localStorage.getItem('stroyrek_isaak_state_v2');
    if (raw) {
      var parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      state.mode = 'view';
      state.editMode = false;
    }
    var bg = localStorage.getItem('stroyrek_isaak_bg_v2');
    if (bg) state.bgDataUrl = bg;
  } catch (e) {}
}

window.onload = function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(function() {
      state.swReady = true;
      updateStatusText();
    }).catch(function() {});
  }

  loadStateSync();
  syncProjectUI();
  populateSelectors();
  applyDarkPlanUI();
  initMap();
  if (state.bgDataUrl) {
    setMapBackground(state.bgDataUrl);
  } else {
    setMapBackground(createDefaultSvgPlan());
  }
  renderAxesAndMarkers();
  updateStatusText();
};

function updateStatusText(customMsg) {
  var badge = state.swReady ? ' | <span style="color:#22c55e;">' + U.offlineReady + '</span>' : '';
  var base = customMsg || ('\u0422\u043E\u0447\u0435\u043A: <b>' + state.points.length + '</b> | \u041B\u0438\u0441\u0442: <b>' + state.currentPage + '/' + state.pageCount + '</b>');
  document.getElementById('statusText').innerHTML = base + badge;
}

function initMap() {
  map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 4,
    zoomSnap: 0.25,
    attributionControl: false
  });
  var bounds = [[0, 0], [PLAN_H, PLAN_W]];
  map.fitBounds(bounds);

  axesLayerGroup = L.layerGroup().addTo(map);
  markersLayerGroup = L.layerGroup().addTo(map);

  map.on('click', function(e) {
    var x = Math.round(e.latlng.lng * 10) / 10;
    var y = Math.round(e.latlng.lat * 10) / 10;

    if (['D', 'VS', 'PR', 'OB'].indexOf(state.mode) !== -1) {
      createPointOnMap(state.mode, x, y);
    } else if (state.mode === 'axis-v') {
      var def = String(state.axes.vertical.filter(function(a) { return a.page === state.currentPage; }).length + 1);
      var lbl = prompt(U.promptVertAxis, def);
      if (lbl) {
        state.axes.vertical.push({ id: Date.now(), label: lbl.trim(), x: x, badgeY: 20, page: state.currentPage });
        state.axes.vertical.sort(function(a, b) { return a.x - b.x; });
        saveState();
        renderAxesAndMarkers();
      }
    } else if (state.mode === 'axis-h') {
      var rus = ['\u0410', '\u0411', '\u0412', '\u0413', '\u0414', '\u0415', '\u0416', '\u0418', '\u041A'];
      var idx = state.axes.horizontal.filter(function(a) { return a.page === state.currentPage; }).length;
      var lblH = prompt(U.promptHorizAxis, rus[idx] || '\u0410');
      if (lblH) {
        state.axes.horizontal.push({ id: Date.now(), label: lblH.trim(), y: y, badgeX: 20, page: state.currentPage });
        state.axes.horizontal.sort(function(a, b) { return a.y - b.y; });
        saveState();
        renderAxesAndMarkers();
      }
    }
  });
}

function setMapBackground(dataUrl) {
  var bounds = [[0, 0], [PLAN_H, PLAN_W]];
  if (imageOverlay) map.removeLayer(imageOverlay);
  imageOverlay = L.imageOverlay(dataUrl, bounds).addTo(map);
}

function createDefaultSvgPlan() {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">' +
    '<rect width="1000" height="700" fill="#f8fafc"/>' +
    '<rect x="60" y="70" width="880" height="540" fill="none" stroke="#334155" stroke-width="4"/>' +
    '<line x1="350" y1="70" x2="350" y2="610" stroke="#64748b" stroke-width="2" stroke-dasharray="10,6"/>' +
    '<line x1="650" y1="70" x2="650" y2="610" stroke="#64748b" stroke-width="2" stroke-dasharray="10,6"/>' +
    '<line x1="60" y1="340" x2="940" y2="340" stroke="#64748b" stroke-width="3"/>' +
    '<text x="500" y="660" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">' + U.svgHint + '</text>' +
  '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

async function handlePlanUpload(e) {
  var file = e.target.files[0];
  if (!file) return;

  try {
    var isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    if (isPdf) {
      var arrayBuffer = await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfDocInstance = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      state.pageCount = pdfDocInstance.numPages;
      state.currentPage = 1;
      updatePageControls();
      await renderPdfPage(1);
    } else {
      pdfDocInstance = null;
      state.pageCount = 1;
      state.currentPage = 1;
      updatePageControls();
      var reader = new FileReader();
      reader.onload = function(ev) {
        state.bgDataUrl = ev.target.result;
        saveState();
        setMapBackground(ev.target.result);
        updateStatusText();
      };
      reader.readAsDataURL(file);
    }
  } catch (err) {
    alert('PDF Error: ' + err.message);
  }
  e.target.value = '';
}

async function renderPdfPage(pageNum) {
  if (!pdfDocInstance) return;
  var page = await pdfDocInstance.getPage(pageNum);
  var viewport = page.getViewport({ scale: 2.0 });
  var canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
  var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  state.bgDataUrl = dataUrl;
  saveState();
  setMapBackground(dataUrl);
  renderAxesAndMarkers();
  updateStatusText();
}

async function changePdfPage(delta) {
  if (!pdfDocInstance) return;
  var next = state.currentPage + delta;
  if (next < 1 || next > state.pageCount) return;
  state.currentPage = next;
  updatePageControls();
  await renderPdfPage(next);
}

function updatePageControls() {
  var show = state.pageCount > 1;
  document.getElementById('btnPrevPage').style.display = show ? 'inline-block' : 'none';
  document.getElementById('btnNextPage').style.display = show ? 'inline-block' : 'none';
  var ind = document.getElementById('pageIndicator');
  ind.style.display = show ? 'inline-block' : 'none';
  ind.textContent = state.currentPage + '/' + state.pageCount;
}

function renderAxesAndMarkers() {
  if (!axesLayerGroup || !markersLayerGroup) return;
  axesLayerGroup.clearLayers();
  markersLayerGroup.clearLayers();

  var curPage = state.currentPage || 1;

  state.axes.vertical.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
    var poly = L.polyline([[0, ax.x], [PLAN_H, ax.x]], { color: '#ef4444', weight: 1.5, dashArray: '6, 6' }).addTo(axesLayerGroup);
    var icon = L.divIcon({ className: '', html: '<div class="axis-badge">' + ax.label + '</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
    var by = (typeof ax.badgeY === 'number') ? ax.badgeY : 20;
    var m = L.marker([by, ax.x], { icon: icon, draggable: true }).addTo(axesLayerGroup);

    m.on('drag', function(ev) {
      var pos = ev.target.getLatLng();
      var nx = Math.max(0, Math.min(PLAN_W, Math.round(pos.lng * 10) / 10));
      poly.setLatLngs([[0, nx], [PLAN_H, nx]]);
    });

    m.on('dragend', function(ev) {
      var pos = ev.target.getLatLng();
      ax.x = Math.max(0, Math.min(PLAN_W, Math.round(pos.lng * 10) / 10));
      ax.badgeY = Math.max(12, Math.min(PLAN_H - 12, Math.round(pos.lat * 10) / 10));
      state.axes.vertical.sort(function(a, b) { return a.x - b.x; });
      saveState();
      renderAxesAndMarkers();
    });

    m.on('click', function(ev) {
      L.DomEvent.stopPropagation(ev);
      var newLbl = prompt(U.promptEditAxis, ax.label);
      if (newLbl === null) return;
      if (newLbl.trim() === '') {
        if (confirm(U.confirmDelAxis)) {
          state.axes.vertical = state.axes.vertical.filter(function(item) { return item !== ax; });
          saveState();
          renderAxesAndMarkers();
        }
      } else {
        ax.label = newLbl.trim();
        saveState();
        renderAxesAndMarkers();
      }
    });
  });

  state.axes.horizontal.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
    var poly = L.polyline([[ax.y, 0], [ax.y, PLAN_W]], { color: '#ef4444', weight: 1.5, dashArray: '6, 6' }).addTo(axesLayerGroup);
    var icon = L.divIcon({ className: '', html: '<div class="axis-badge">' + ax.label + '</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
    var bx = (typeof ax.badgeX === 'number') ? ax.badgeX : 20;
    var m = L.marker([ax.y, bx], { icon: icon, draggable: true }).addTo(axesLayerGroup);

    m.on('drag', function(ev) {
      var pos = ev.target.getLatLng();
      var ny = Math.max(0, Math.min(PLAN_H, Math.round(pos.lat * 10) / 10));
      poly.setLatLngs([[ny, 0], [ny, PLAN_W]]);
    });

    m.on('dragend', function(ev) {
      var pos = ev.target.getLatLng();
      ax.y = Math.max(0, Math.min(PLAN_H, Math.round(pos.lat * 10) / 10));
      ax.badgeX = Math.max(12, Math.min(PLAN_W - 12, Math.round(pos.lng * 10) / 10));
      state.axes.horizontal.sort(function(a, b) { return a.y - b.y; });
      saveState();
      renderAxesAndMarkers();
    });

    m.on('click', function(ev) {
      L.DomEvent.stopPropagation(ev);
      var newLbl = prompt(U.promptEditAxis, ax.label);
      if (newLbl === null) return;
      if (newLbl.trim() === '') {
        if (confirm(U.confirmDelAxis)) {
          state.axes.horizontal = state.axes.horizontal.filter(function(item) { return item !== ax; });
          saveState();
          renderAxesAndMarkers();
        }
      } else {
        ax.label = newLbl.trim();
        saveState();
        renderAxesAndMarkers();
      }
    });
  });

  state.points.filter(function(p) { return (p.page || 1) === curPage; }).forEach(function(pt) {
    var extra = (pt.type === 'PR' && pt.mpa) ? (' (' + pt.mpa + ')') : '';
    var icon = L.divIcon({
      className: '',
      html: '<div class="pt-marker pt-marker-' + pt.type + '">' + pt.code + extra + '</div>',
      iconSize: [34, 24],
      iconAnchor: [17, 12]
    });

    var marker = L.marker([pt.y, pt.x], {
      icon: icon,
      draggable: state.editMode
    }).addTo(markersLayerGroup);

    marker.on('click', function(ev) {
      L.DomEvent.stopPropagation(ev);
      if (!state.editMode) openPointModal(pt.id);
    });

    marker.on('dragend', function(ev) {
      var pos = ev.target.getLatLng();
      pt.x = Math.round(pos.lng * 10) / 10;
      pt.y = Math.round(pos.lat * 10) / 10;
      var autoAx = computeAxesForCoords(pt.x, pt.y, pt.page || 1);
      if (autoAx) { pt.axes = autoAx; refreshPointPhotoNames(pt); }
      saveState();
    });
  });
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.workbar .tool-btn').forEach(function(b) { b.className = 'tool-btn'; });
  var btn = document.getElementById('tool-' + m);
  if (btn) {
    if (m === 'view') btn.classList.add('active-view');
    else if (['D', 'VS', 'PR', 'OB'].indexOf(m) !== -1) btn.classList.add('active-' + m);
    else btn.classList.add('active-axis');
  }
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  var btn = document.getElementById('modeBtn');
  btn.textContent = state.editMode ? U.modeMoveActive : U.modeCorrection;
  btn.className = state.editMode ? 'active-mode' : '';
  renderAxesAndMarkers();
}

function applyDarkPlanUI() {
  var btn = document.getElementById('themeBtn');
  if (state.darkPlan) {
    document.body.classList.add('dark-plan');
    btn.textContent = U.btnLight;
  } else {
    document.body.classList.remove('dark-plan');
    btn.textContent = U.btnDark;
  }
}

function toggleDarkPlan() {
  state.darkPlan = !state.darkPlan;
  saveState();
  applyDarkPlanUI();
}

function createPointOnMap(type, x, y) {
  var num = state.points.filter(function(p) { return p.type === type; }).length + 1;
  var page = state.currentPage || 1;
  var prefix = TYPE_PREFIX[type] || type;
  var newPt = {
    id: 'pt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    type: type,
    code: prefix + num,
    page: page,
    x: x,
    y: y,
    axes: computeAxesForCoords(x, y, page) || '',
    zone: U.sheetWord + ' ' + page,
    structure: state.settings.structures[0] || '',
    description: '',
    category: state.settings.defectCategories[3] || '',
    openingResult: '',
    instrumentId: state.settings.instruments[0] ? state.settings.instruments[0].id : 'ips_mg403',
    readings: '',
    mpa: '',
    concreteClass: '',
    customValues: {},
    photos: []
  };
  state.points.push(newPt);
  setMode('view');
  saveState();
  renderAxesAndMarkers();
  updateStatusText();
  openPointModal(newPt.id);
}

function openPointModal(ptId) {
  state.selectedPtId = ptId;
  var pt = state.points.find(function(p) { return p.id === ptId; });
  if (!pt) return;

  document.getElementById('ptModalTitle').textContent = pt.code + ' (' + (pt.axes || U.noAxes) + ')';
  document.getElementById('ptType').value = pt.type;
  document.getElementById('ptCode').value = pt.code;
  document.getElementById('ptAxes').value = pt.axes || '';
  document.getElementById('ptZone').value = pt.zone || '';
  document.getElementById('ptStructure').value = pt.structure || '';
  document.getElementById('ptDesc').value = pt.description || '';
  document.getElementById('ptCategory').value = pt.category || '';
  document.getElementById('ptOpeningRes').value = pt.openingResult || '';
  document.getElementById('ptInstrument').value = pt.instrumentId || '';
  document.getElementById('ptReadings').value = pt.readings || '';
  document.getElementById('ptMpa').value = pt.mpa || '';
  document.getElementById('ptConcreteClass').value = pt.concreteClass || '';

  document.getElementById('blockDefect').style.display = pt.type === 'D' ? 'flex' : 'none';
  document.getElementById('blockOpening').style.display = pt.type === 'VS' ? 'flex' : 'none';
  document.getElementById('blockStrength').style.display = pt.type === 'PR' ? 'flex' : 'none';

  renderCustomAttributesInputs(pt);
  renderPointPhotos(pt);
  document.getElementById('pointModal').classList.add('active');
}

function closePointModal() {
  document.getElementById('pointModal').classList.remove('active');
  state.selectedPtId = null;
  renderAxesAndMarkers();
}

function onPointTypeChange() {
  var pt = state.points.find(function(p) { return p.id === state.selectedPtId; });
  if (!pt) return;
  pt.type = document.getElementById('ptType').value;
  saveActivePoint(true);
  openPointModal(pt.id);
}

function saveActivePoint(renamePhotos) {
  var pt = state.points.find(function(p) { return p.id === state.selectedPtId; });
  if (!pt) return;
  pt.type = document.getElementById('ptType').value;
  pt.code = document.getElementById('ptCode').value.trim();
  pt.axes = document.getElementById('ptAxes').value.trim();
  pt.zone = document.getElementById('ptZone').value.trim();
  pt.structure = document.getElementById('ptStructure').value;
  pt.description = document.getElementById('ptDesc').value;
  pt.category = document.getElementById('ptCategory').value;
  pt.openingResult = document.getElementById('ptOpeningRes').value;
  pt.instrumentId = document.getElementById('ptInstrument').value;
  pt.readings = document.getElementById('ptReadings').value;
  pt.mpa = document.getElementById('ptMpa').value;
  pt.concreteClass = document.getElementById('ptConcreteClass').value;

  document.getElementById('ptModalTitle').textContent = pt.code + ' (' + (pt.axes || U.noAxes) + ')';
  if (renamePhotos && pt.photos.length) {
    refreshPointPhotoNames(pt);
    renderPointPhotos(pt);
  }
  saveState();
  renderAxesAndMarkers();
}

function deleteActivePoint() {
  if (!state.selectedPtId || !confirm(U.confirmDelPt)) return;
  state.points = state.points.filter(function(p) { return p.id !== state.selectedPtId; });
  saveState();
  updateStatusText();
  closePointModal();
}

function onStrengthReadingsInput() {
  var nums = document.getElementById('ptReadings').value
    .split(/[,\s;]+/).map(function(s) { return parseFloat(s.replace(',', '.')); }).filter(function(n) { return !isNaN(n) && n > 0; });
  if (nums.length > 0) {
    var avg = nums.reduce(function(a, b) { return a + b; }, 0) / nums.length;
    var valid = nums.filter(function(v) { return Math.abs(v - avg) / avg <= 0.10; });
    var arr = valid.length ? valid : nums;
    var mean = Math.round((arr.reduce(function(a, b) { return a + b; }, 0) / arr.length) * 10) / 10;
    document.getElementById('ptMpa').value = mean;
    document.getElementById('ptConcreteClass').value = estimateConcreteClass(mean);
  }
  saveActivePoint(false);
}

function onMpaInput() {
  var val = parseFloat(document.getElementById('ptMpa').value);
  if (!isNaN(val) && val > 0) document.getElementById('ptConcreteClass').value = estimateConcreteClass(val);
  saveActivePoint(false);
}

function estimateConcreteClass(mpa) {
  var t = [
    { min: 64, cls: 'B55' }, { min: 55, cls: 'B50' }, { min: 51, cls: 'B45' },
    { min: 45, cls: 'B40' }, { min: 38.5, cls: 'B35' }, { min: 32, cls: 'B30' },
    { min: 28, cls: 'B27.5' }, { min: 25, cls: 'B25' }, { min: 21.5, cls: 'B22.5' },
    { min: 19, cls: 'B20' }, { min: 14, cls: 'B15' }, { min: 0, cls: 'B10' }
  ];
  var found = t.find(function(r) { return mpa >= r.min; });
  return found ? found.cls : 'B15';
}

function buildPhotoFileName(pt, index, isoTs) {
  var clean = function(s) { return (s || '').replace(/[^a-zA-Z\u0400-\u04FF0-9_-]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, ''); };
  var obj = clean(state.project.shortName || state.project.cipher);
  var zone = clean(pt.zone || ('L' + (pt.page || 1)));
  var ax = pt.axes ? clean(pt.axes) : U.noAxes;
  var dt = (isoTs || new Date().toISOString()).replace(/[-:]/g, '').replace('T', '_').slice(0, 15);
  return obj + '_' + zone + '_' + ax + '_' + clean(pt.code) + '_' + dt + '_' + (index + 1) + '.jpg';
}

function refreshPointPhotoNames(pt) {
  pt.photos.forEach(function(ph, i) { ph.fileName = buildPhotoFileName(pt, i, ph.timestamp); });
}

function handlePointPhotos(e) {
  var pt = state.points.find(function(p) { return p.id === state.selectedPtId; });
  if (!pt) return;
  Array.from(e.target.files).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var maxSide = 1280;
        var w = img.width, h = img.height;
        if (w > maxSide || h > maxSide) {
          if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
          else { w = Math.round(w * maxSide / h); h = maxSide; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var jpegDataUrl = c.toDataURL('image/jpeg', 0.85);
        var ts = file.lastModified ? new Date(file.lastModified).toISOString() : new Date().toISOString();
        pt.photos.push({
          id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          fileName: buildPhotoFileName(pt, pt.photos.length, ts),
          timestamp: ts,
          dataUrl: jpegDataUrl
        });
        renderPointPhotos(pt);
        saveState();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderPointPhotos(pt) {
  var box = document.getElementById('ptPhotosBox');
  if (!pt.photos.length) {
    box.innerHTML = '<div style="grid-column:1/-1; font-size:11px; color:var(--text-muted);">' + U.noPhotos + '</div>';
    return;
  }
  box.innerHTML = pt.photos.map(function(ph, i) {
    return '<div class="photo-card">' +
      '<img src="' + ph.dataUrl + '">' +
      '<div class="photo-meta">' +
        '<div><b>#' + (i + 1) + '</b> ' + ph.fileName + '</div>' +
        '<button type="button" class="btn-del" style="padding:2px 6px; font-size:10px; margin-top:3px;" onclick="removePhoto(\'' + ph.id + '\')">X</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function removePhoto(phId) {
  var pt = state.points.find(function(p) { return p.id === state.selectedPtId; });
  if (!pt) return;
  pt.photos = pt.photos.filter(function(p) { return p.id !== phId; });
  refreshPointPhotoNames(pt);
  renderPointPhotos(pt);
  saveState();
}

function computeAxesForCoords(x, y, page) {
  var v = state.axes.vertical.filter(function(a) { return a.page === page; }).sort(function(a, b) { return a.x - b.x; });
  var h = state.axes.horizontal.filter(function(a) { return a.page === page; }).sort(function(a, b) { return a.y - b.y; });
  if (!v.length && !h.length) return '';

  var vp = v.length === 1 ? v[0].label : '';
  if (v.length >= 2) {
    var l = v[0].label, r = v[v.length - 1].label;
    for (var i = 0; i < v.length - 1; i++) {
      if (x >= v[i].x && x <= v[i + 1].x) { l = v[i].label; r = v[i + 1].label; break; }
    }
    vp = l + '-' + r;
  }

  var hp = h.length === 1 ? h[0].label : '';
  if (h.length >= 2) {
    var b = h[0].label, t = h[h.length - 1].label;
    for (var j = 0; j < h.length - 1; j++) {
      if (y >= h[j].y && y <= h[j + 1].y) { b = h[j].label; t = h[j + 1].label; break; }
    }
    hp = b + '-' + t;
  }
  return [hp, vp].filter(Boolean).join(' / ');
}

function recalculateAllPointAxes() {
  var cnt = 0;
  state.points.forEach(function(pt) {
    var ax = computeAxesForCoords(pt.x, pt.y, pt.page || 1);
    if (ax) { pt.axes = ax; refreshPointPhotoNames(pt); cnt++; }
  });
  saveState();
  renderAxesAndMarkers();
  alert(U.axesUpdatedMsg + cnt);
}

/* NATIVE OPENXML .DOCX GENERATOR VIA JSZIP (OPENS IN ALL MICROSOFT WORD VERSIONS) */
function xmlEscape(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function wParagraph(text, bold, alignCenter, sizeHalfPt) {
  var jc = alignCenter ? '<w:jc w:val="center"/>' : '';
  var b = bold ? '<w:b/>' : '';
  var sz = sizeHalfPt || 24;
  return '<w:p><w:pPr>' + jc + '<w:spacing w:after="120"/></w:pPr>' +
    '<w:r><w:rPr>' + b + '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/></w:rPr>' +
    '<w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r></w:p>';
}

async function buildAndDownloadDocx(bodyXml, mediaItems, fileName) {
  var zip = new JSZip();

  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="jpg" ContentType="image/jpeg"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '</Types>'
  );

  zip.folder('_rels').file('.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rIdDoc" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>'
  );

  var relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  var mediaFolder = zip.folder('word').folder('media');

  mediaItems.forEach(function(item) {
    relsXml += '<Relationship Id="' + item.rId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/' + item.fileName + '"/>';
    var b64 = item.dataUrl.split(',')[1];
    if (b64) mediaFolder.file(item.fileName, b64, { base64: true });
  });
  relsXml += '</Relationships>';
  zip.folder('word').folder('_rels').file('document.xml.rels', relsXml);

  var docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
                'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
                'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
                'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
                'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<w:body>' +
        bodyXml +
        '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="850" w:bottom="1134" w:left="1417"/></w:sectPr>' +
      '</w:body>' +
    '</w:document>';

  zip.folder('word').file('document.xml', docXml);

  var blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

  body += '<w:tbl>' + wTableBorders() +

  await buildAndDownloadDocx(body, [], state.project.cipher + '_Prilozhenie_4_Protokol_Prochnosti.docx');

/* RENDER ANNOTATED SCHEME TO PNG */
function buildAnnotatedSchemeDataUrl() {
  return new Promise(function(resolve) {
    var src = state.bgDataUrl || createDefaultSvgPlan();
    var img = new Image();
    img.onload = function() {
      try {
        var c = document.createElement('canvas');
        c.width = img.width || 1200;
        c.height = img.height || 840;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);

        var sx = c.width / PLAN_W;
        var sy = c.height / PLAN_H;
        var curPage = state.currentPage || 1;

        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        state.axes.vertical.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
          var px = ax.x * sx;
          ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, c.height); ctx.stroke();
        });
        state.axes.horizontal.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
          var py = (PLAN_H - ax.y) * sy;
          ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(c.width, py); ctx.stroke();
        });
        ctx.setLineDash([]);

        state.axes.vertical.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
          var px = ax.x * sx;
          var by = (typeof ax.badgeY === 'number') ? ax.badgeY : 20;
          var py = (PLAN_H - by) * sy;
          ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = '#ef4444'; ctx.stroke();
          ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(ax.label, px, py);
        });

        state.axes.horizontal.filter(function(a) { return a.page === curPage; }).forEach(function(ax) {
          var bx = (typeof ax.badgeX === 'number') ? ax.badgeX : 20;
          var px = bx * sx;
          var py = (PLAN_H - ax.y) * sy;
          ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = '#ef4444'; ctx.stroke();
          ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(ax.label, px, py);
        });

        var cols = { D: '#ef4444', VS: '#f59e0b', PR: '#0ea5e9', OB: '#22c55e' };
        state.points.filter(function(p) { return (p.page || 1) === curPage; }).forEach(function(pt) {
          var px = pt.x * sx;
          var py = (PLAN_H - pt.y) * sy;
          ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2);
          ctx.fillStyle = cols[pt.type] || '#3b82f6'; ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
          ctx.fillStyle = (pt.type === 'VS' || pt.type === 'OB') ? '#000000' : '#ffffff';
          ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(pt.code, px, py);
        });

        resolve(c.toDataURL('image/png'));
      } catch (err) {
        resolve(null);
      }
    };
    img.onerror = function() { resolve(null); };
    img.src = src;
  });
}

async function exportAnnotatedSchemePng() {
  var url = await buildAnnotatedSchemeDataUrl();
  if (!url) return;
  var a = document.createElement('a');
  a.href = url;
  a.download = state.project.cipher + '_Prilozhenie_2_Shema_List' + state.currentPage + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function buildExcelWorkbook() {
  var wb = XLSX.utils.book_new();
  var customCols = state.settings.customAttributes;

  var allRows = state.points.map(function(pt, i) {
    var r = {
      '\u2116': i + 1,
      '\u0422\u0438\u043F': TYPE_PREFIX[pt.type] || pt.type,
      '\u041A\u043E\u0434': pt.code,
      '\u041B\u0438\u0441\u0442': pt.page || 1,
      '\u041E\u0441\u0438': pt.axes || U.noAxes,
      '\u0423\u0447\u0430\u0441\u0442\u043E\u043A': pt.zone || '',
      '\u041A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u044F': pt.structure || '',
      '\u041E\u043F\u0438\u0441\u0430\u043D\u0438\u0435': pt.description || '',
      '\u041A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F': pt.type === 'D' ? pt.category : '',
      '\u0412\u0441\u043A\u0440\u044B\u0442\u0438\u0435': pt.type === 'VS' ? pt.openingResult : '',
      '\u041F\u0440\u043E\u0447\u043D\u043E\u0441\u0442\u044C, \u041C\u041F\u0430': pt.type === 'PR' ? pt.mpa : '',
      '\u041A\u043B\u0430\u0441\u0441 \u0431\u0435\u0442\u043E\u043D\u0430': pt.type === 'PR' ? pt.concreteClass : '',
      '\u0424\u0430\u0439\u043B\u044B \u0444\u043E\u0442\u043E': pt.photos.map(function(p) { return 'photos/' + p.fileName; }).join('; ')
    };
    customCols.forEach(function(c) { r[c.name] = (pt.customValues && pt.customValues[c.id]) || ''; });
    return r;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allRows.length ? allRows : [{}]), '\u0412\u0441\u0435_\u0442\u043E\u0447\u043A\u0438');

  var defRows = state.points.filter(function(p) { return p.type === 'D'; }).map(function(p, i) {
    return {
      '\u2116': i + 1,
      '\u041A\u043E\u0434': p.code,
      '\u041E\u0441\u0438': p.axes || '',
      '\u041E\u043F\u0438\u0441\u0430\u043D\u0438\u0435 \u0434\u0435\u0444\u0435\u043A\u0442\u0430': p.code + '. ' + (p.description || ''),
      '\u041A\u0430\u0442\u0435\u0433\u043E\u0440\u0438\u044F': p.category,
      '\u0424\u043E\u0442\u043E': p.photos.map(function(ph) { return ph.fileName; }).join('; ')
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(defRows.length ? defRows : [{}]), '\u0412\u0435\u0434\u043E\u043C\u043E\u0441\u0442\u044C_\u0434\u0435\u0444\u0435\u043A\u0442\u043E\u0432');

  var prRows = state.points.filter(function(p) { return p.type === 'PR'; }).map(function(p) {
    return {
      '\u041E\u0431\u043E\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435': p.code,
      '\u041E\u0441\u0438': p.axes || '',
      '\u0417\u0430\u043C\u0435\u0440\u044B': p.readings || '',
      '\u041F\u0440\u043E\u0447\u043D\u043E\u0441\u0442\u044C \u0431\u0435\u0442\u043E\u043D\u0430, \u041C\u041F\u0430': p.mpa,
      '\u041A\u043B\u0430\u0441\u0441 \u0431\u0435\u0442\u043E\u043D\u0430': p.concreteClass
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prRows.length ? prRows : [{}]), '\u041F\u0440\u043E\u0442\u043E\u043A\u043E\u043B_\u043F\u0440\u043E\u0447\u043D\u043E\u0441\u0442\u0438');

  return wb;
}

function exportExcel() {
  XLSX.writeFile(buildExcelWorkbook(), state.project.cipher + '_Survey_DB.xlsx');
}

async function exportFullZip() {
  var zip = new JSZip();
  zip.file('project_db.json', JSON.stringify(state, null, 2));
  zip.file('settings_template.json', JSON.stringify(state.settings, null, 2));

  var wb = buildExcelWorkbook();
  zip.file('reports/' + state.project.cipher + '_Survey_DB.xlsx', XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));

  var photosFolder = zip.folder('photos');
  state.points.forEach(function(pt) {
    pt.photos.forEach(function(ph) {
      var b64 = ph.dataUrl.split(',')[1];
      if (b64) photosFolder.file(ph.fileName, b64, { base64: true });
    });
  });

  var schemeUrl = await buildAnnotatedSchemeDataUrl();
  if (schemeUrl && schemeUrl.indexOf(',') !== -1) {
    zip.folder('plans').file(state.project.cipher + '_Shema_List' + state.currentPage + '.png', schemeUrl.split(',')[1], { base64: true });
  }

  var blob = await zip.generateAsync({ type: 'blob' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = state.project.cipher + '_Project.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportProjectBackup() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = state.project.cipher + '_project_db.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function importProjectBackup(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      state = JSON.parse(ev.target.result);
      syncProjectUI(); populateSelectors(); applyDarkPlanUI();
      if (state.bgDataUrl) setMapBackground(state.bgDataUrl);
      renderAxesAndMarkers();
      saveState();
      updateStatusText();
    } catch (err) { alert('JSON Error'); }
  };
  r.readAsText(f);
  e.target.value = '';
}
